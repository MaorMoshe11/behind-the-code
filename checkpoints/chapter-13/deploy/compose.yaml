# One deployed environment of my-agent: the chat service (api, worker, database, migrations)
# and the notes service (notes, its own database). Each image has its own version.
# The same file serves staging and prod; deploy/<environment>.env says how they differ.
# Run it through scripts/deploy.py, which passes the project name and the env file.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_DB: agent
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password  # the image reads the file itself
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data  # one volume per environment: separate data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    image: my-agent:${IMAGE_TAG:?IMAGE_TAG is not set}  # the image is built once, never here
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://agent@db:5432/agent  # where: configuration
      DATABASE_PASSWORD_FILE: /run/secrets/db_password  # the password: a secret
      APP_ENV: ${APP_ENV:?APP_ENV is not set}
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
    profiles: [migrate]  # runs only when asked for: a separate step of a deploy

  api:
    image: my-agent:${IMAGE_TAG:?IMAGE_TAG is not set}
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://agent@db:5432/agent
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      AGENT_API_KEY_FILE: /run/secrets/agent_api_key
      NOTES_URL: http://notes:8100
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTES_API_KEY_FILE: /run/secrets/notes_api_key
      CHAT_MOCK: ${CHAT_MOCK:-0}
      CHAT_MODEL: ${CHAT_MODEL:-claude-opus-5-5}
      CHAT_MAX_TURNS: ${CHAT_MAX_TURNS:-10}
      CHAT_LOG_LEVEL: ${CHAT_LOG_LEVEL:-INFO}
    secrets: [db_password, agent_api_key, notes_api_key]
    ports:
      - "127.0.0.1:${API_PORT:?API_PORT is not set}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped  # if the process exits, Docker starts it again

  notes-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_DB: notes
      POSTGRES_PASSWORD_FILE: /run/secrets/notes_db_password
    secrets: [notes_db_password]
    volumes:
      - notesdata:/var/lib/postgresql/data  # the notes service's data, apart from the chat's
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  notes:
    image: my-agent-notes:${NOTES_IMAGE_TAG:?NOTES_IMAGE_TAG is not set}
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://notes@notes-db:5432/notes
      DATABASE_PASSWORD_FILE: /run/secrets/notes_db_password
      NOTES_API_KEY_FILE: /run/secrets/notes_api_key
    secrets: [notes_db_password, notes_api_key]
    # No ports: only the api reaches it, over the environment's own network.
    depends_on:
      notes-db:
        condition: service_healthy
    restart: unless-stopped

  # Kafka, its topics, and the usage worker: as in the root compose.yaml, with restarts.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  topics:
    image: apache/kafka:3.9.1
    command:
      - bash
      - -c
      - |
        for topic in chat-events chat-events-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$topic --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  worker:
    image: my-agent:${IMAGE_TAG:?IMAGE_TAG is not set}  # the same image as the api
    command: ["python", "-m", "worker"]
    healthcheck:
      disable: true
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USAGE_DATABASE_URL: sqlite:////data/usage.db
    volumes:
      - usagedata:/data
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

# Each secret is a file on the host that never enters git or the image. Compose mounts it
# read-only at /run/secrets/<name> inside the containers that list it.
secrets:
  db_password:
    file: ./secrets/${APP_ENV}/db_password.txt
  agent_api_key:
    file: ./secrets/${APP_ENV}/agent_api_key.txt
  notes_db_password:
    file: ./secrets/${APP_ENV}/notes_db_password.txt
  notes_api_key:
    file: ./secrets/${APP_ENV}/notes_api_key.txt

volumes:
  pgdata:
  notesdata:
  kafkadata:
  usagedata:
