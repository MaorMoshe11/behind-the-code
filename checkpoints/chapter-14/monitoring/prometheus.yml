# Prometheus for local development: it pulls (scrapes) /metrics from every target, keeps
# the numbers, and evaluates the alert rules. Start it with:
#   docker compose --profile monitoring up -d
global:
  scrape_interval: 5s  # often, for learning; 15 s to 60 s is usual in production
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]  # GET /metrics on the chat api
    authorization:  # Authorization: Bearer <the token in this file>
      credentials_file: /run/secrets/metrics_token
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]  # the worker's own small metrics server
        # No token: port 9100 is reachable only inside the compose network.
