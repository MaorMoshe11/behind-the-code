# CI: check every pull request (and every push to main) on a fresh machine.
# The same commands run on your computer with: uv run --locked python scripts/ci_local.py
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read  # this workflow only reads the code

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:  # a throwaway Postgres for the migration tests, like db in compose.yaml
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent  # lives for one run, holds nothing real
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agent:agent@127.0.0.1:5432/agent_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.14"  # the same uv as in the Dockerfile
          enable-cache: true  # reuse downloaded packages; the cache key includes uv.lock
      - name: Install the locked packages
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy agent scripts worker pipelines evals
      - name: Tests
        run: uv run pytest
      - name: Agent evals (offline, against the mock)
        run: uv run python -m evals.run --mock --min-pass-rate 1

  notes:
    name: Notes service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: notes-service  # its own project: its own lock file and tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: notes-service/uv.lock
      - name: Install the locked packages
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy notes
      - name: Tests
        run: uv run pytest

  image:
    name: Build the images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: docker build -t my-agent:ci .
      - name: Check that the image starts
        run: docker run --rm -e CHAT_MOCK=1 -e AGENT_API_KEY=ci -e DATABASE_URL=sqlite:// my-agent:ci python -c "from agent.api import create_app; print(create_app().version)"
      - name: Build the notes service
        run: docker build -t my-agent-notes:ci notes-service
      - name: Check that the notes image starts
        run: docker run --rm -e NOTES_API_KEY=ci -e DATABASE_URL=sqlite:// my-agent-notes:ci python -c "from notes.api import create_app; print(create_app().version)"

  security:
    name: Secrets and known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # every commit: a secret in an old commit is still a leak
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # to read the pull request's commits
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.14"
      - name: Audit the chat service's packages
        run: uv audit --locked --preview-features audit
      - name: Audit the notes service's packages
        run: uv audit --locked --preview-features audit
        working-directory: notes-service
