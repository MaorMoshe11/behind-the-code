# Local development: the chat service (api, worker) and the notes service, each with its own
# database, and Kafka between the api and the worker. Prometheus with --profile monitoring.
# Start everything with: docker compose up --build -d
services:
  db:
    image: postgres:17-alpine
    environment:
      # A local development database. Real passwords never go in this file (chapter 10).
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes:
      - pgdata:/var/lib/postgresql/data  # the data lives in a volume, not in the container
    ports:
      - "127.0.0.1:5432:5432"  # only this computer can connect, for tools and scripts
    healthcheck:
      # "Ready" means Postgres accepts connections, not just that the process started.
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 5s
      retries: 30  # a new database needs time to initialise on its first start

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]  # a separate step, as in chapter 7
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/agent
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env  # AGENT_API_KEY, CHAT_MOCK and the rest, from your private file
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/agent  # wins over .env
      NOTES_URL: http://notes:8100  # a service's name is its address inside compose
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092  # publish events; the api does not wait for Kafka
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No depends_on notes: the chat starts, and works, without it.

  # The notes service: its own code (notes-service/), image and database.
  notes-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes  # local only, like db above
      POSTGRES_DB: notes
    volumes:
      - notesdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      timeout: 5s
      retries: 30

  notes:
    build: ./notes-service
    environment:
      DATABASE_URL: postgresql+psycopg://notes:notes@notes-db:5432/notes
      NOTES_API_KEY: ${NOTES_API_KEY:?set NOTES_API_KEY in .env}  # compose reads .env too
      # Fault injection for chapter 11's experiments: off unless set in the terminal.
      NOTES_DELAY_SECONDS: ${NOTES_DELAY_SECONDS:-0}
      NOTES_FAIL_AFTER_SAVE: ${NOTES_FAIL_AFTER_SAVE:-0}
    ports:
      - "127.0.0.1:8100:8100"  # for you and your tools; the chat uses the network inside
    depends_on:
      notes-db:
        condition: service_healthy

  # Kafka: one broker in KRaft mode (it is its own controller; no ZooKeeper).
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092  # the address clients are told to use
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker can keep one copy of everything, no more.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created on purpose (topics below)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m  # small, for a laptop
    volumes:
      - kafkadata:/var/lib/kafka/data  # the events survive `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 2s
      timeout: 5s
      retries: 30
    # No ports: only containers in this compose project talk to it.

  # Creates the topics once, like migrate creates the tables. --if-not-exists: safe to rerun.
  topics:
    image: apache/kafka:3.9.1
    command:
      - bash
      - -c
      - |
        for topic in chat-events chat-events-dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$topic --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  # The usage worker: the same image as the api, another process, its own small database.
  worker:
    build: .
    command: ["python", "-m", "worker"]
    healthcheck:
      disable: true  # the image checks the api on port 8000; a worker has no port
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USAGE_DATABASE_URL: sqlite:////data/usage.db
      # Fault injection for chapter 12's experiment: off unless set in the terminal.
      WORKER_CRASH_BEFORE_COMMIT: ${WORKER_CRASH_BEFORE_COMMIT:-0}
    volumes:
      - usagedata:/data
    depends_on:
      topics:
        condition: service_completed_successfully
    # Its metrics are on port 9100 inside the network, for Prometheus. No host port: with
    # --scale worker=2 two containers would want the same one.

  # Prometheus scrapes /metrics of the api and the worker and evaluates the alert rules.
  # Started only on request: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes:
      - ./monitoring:/etc/prometheus:ro  # prometheus.yml and alerts.yml, read-only
    secrets: [metrics_token]  # the token it sends to read the api's /metrics
    ports:
      - "127.0.0.1:9090:9090"

# METRICS_TOKEN from .env, as a file at /run/secrets/metrics_token: Prometheus reads files.
secrets:
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  pgdata:
  notesdata:
  kafkadata:
  usagedata:
